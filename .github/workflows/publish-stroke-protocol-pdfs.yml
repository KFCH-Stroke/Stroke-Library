name: Publish Stroke Protocol PDFs
on:
  push:
    paths:
      - 'Stroke/Protocols/protocols_payload.json'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode protocol PDFs
        run: |
          python - <<'PY'
          import json, base64
          from pathlib import Path
          payload=json.loads(Path('Stroke/Protocols/protocols_payload.json').read_text())
          root=Path('Stroke/Protocols')
          for name,data in payload.items():
              (root/name).write_bytes(base64.b64decode(data))
          PY
      - name: Remove payload
        run: rm -f Stroke/Protocols/protocols_payload.json
      - name: Commit PDFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Stroke/Protocols
          git commit -m 'Publish Stroke protocol PDF files [skip ci]' || exit 0
          git push