name: Publish Stroke Protocol PDFs

on:
  push:
    branches: [main]
    paths:
      - 'Stroke/Protocols/.upload/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild Stroke Protocol PDF bundle
        shell: bash
        run: |
          set -euo pipefail
          cd Stroke/Protocols
          cat .upload/bundle3.part* | base64 -d > /tmp/stroke_protocols_bundle.tar.gz
          tar -xzf /tmp/stroke_protocols_bundle.tar.gz -C .
          for f in *.pdf; do
            test -s "$f"
            head -c 5 "$f" | grep -q '%PDF-'
          done
          test "$(find . -maxdepth 1 -type f -name '*.pdf' | wc -l)" -ge 12
          rm -rf .upload
      - name: Commit published PDFs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Stroke/Protocols
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Stroke Protocol PDFs'
          git push
